# Builds the WebAssembly target and publishes it to GitHub Pages on every push to master.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, newer pushes win.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up emscripten
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git ~/emsdk
          ~/emsdk/emsdk install latest
          ~/emsdk/emsdk activate latest

      - name: Build
        run: |
          source ~/emsdk/emsdk_env.sh
          emcmake cmake -S . -B build-web -DPLATFORM=Web -DCMAKE_BUILD_TYPE=Release
          cmake --build build-web

      - name: Assemble site
        run: |
          mkdir site
          cp build-web/pathfinder.html site/index.html
          cp build-web/pathfinder.js build-web/pathfinder.wasm site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
